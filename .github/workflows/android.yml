name: Android

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
      - name: List available Android 36/37 packages
        run: sdkmanager --list --channel=3 | grep -E "platforms;android-3[67]|system-images;android-37" || true
      - name: Install Android 37 SDK
        run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
      - name: Unit tests, lint, and debug assembly
        run: ./gradlew testDebugUnitTest lintDebug :app:assembleDebug --stacktrace
      - name: Upload lint reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lint-reports
          path: "**/build/reports/lint-results-*.html"
          if-no-files-found: warn

  instrumented:
    name: Instrumented tests (${{ matrix.form-factor }}, API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 36
            channel: stable
            profile: pixel_6
            form-factor: compact
          - api-level: "37.0"
            channel: canary
            profile: pixel_tablet
            form-factor: expanded
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Free disk space for the emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk \
            /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build instrumented APKs before the emulator boots
        run: ./gradlew packageDebugAndroidTest :app:packageDebug --stacktrace
      - name: Stop the Gradle daemon before the emulator boots
        run: ./gradlew --stop
      - name: Run device suites
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          channel: ${{ matrix.channel }}
          arch: x86_64
          target: google_apis
          profile: ${{ matrix.profile }}
          disable-animations: true
          disk-size: 8192M
          script: >-
            ./gradlew
            :core:data:connectedDebugAndroidTest
            :app:connectedDebugAndroidTest
            :feature:tasks:connectedDebugAndroidTest
            :feature:projects:connectedDebugAndroidTest
            :feature:schedule:connectedDebugAndroidTest
            :feature:more:connectedDebugAndroidTest
            --stacktrace
            --continue
      - name: Upload instrumented-test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: instrumented-test-reports-api-${{ matrix.api-level }}
          path: "**/build/outputs/androidTest-results/connected/**/*.xml"
          if-no-files-found: warn

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
      - name: List available Android 36/37 packages
        run: sdkmanager --list --channel=3 | grep -E "platforms;android-3[67]|system-images;android-37" || true
      - name: Install Android 37 SDK
        run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
      - name: Release assembly
        run: ./gradlew :app:assembleRelease --stacktrace
