name: Android

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
      - name: Install Android 37 SDK
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"
      - name: Unit tests, lint, and debug assembly
        run: ./gradlew testDebugUnitTest lintDebug :app:assembleDebug --stacktrace
      - name: Upload lint reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lint-reports
          path: "**/build/reports/lint-results-*.html"
          if-no-files-found: warn

  instrumented:
    name: Instrumented tests (${{ matrix.form-factor }}, API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 36
            channel: stable
            profile: pixel_6
            form-factor: compact
          - api-level: 37
            channel: canary
            profile: pixel_tablet
            form-factor: expanded
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run device suites
        uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: ${{ matrix.api-level }}
          channel: ${{ matrix.channel }}
          arch: x86_64
          target: google_apis
          profile: ${{ matrix.profile }}
          disable-animations: true
          script: >-
            ./gradlew
            :core:data:connectedDebugAndroidTest
            :app:connectedDebugAndroidTest
            :feature:tasks:connectedDebugAndroidTest
            :feature:projects:connectedDebugAndroidTest
            :feature:schedule:connectedDebugAndroidTest
            :feature:more:connectedDebugAndroidTest
            --stacktrace
      - name: Upload instrumented-test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: instrumented-test-reports-api-${{ matrix.api-level }}
          path: "**/build/outputs/androidTest-results/connected/**/*.xml"
          if-no-files-found: warn

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
      - name: Install Android 37 SDK
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"
      - name: Release assembly
        run: ./gradlew :app:assembleRelease --stacktrace
